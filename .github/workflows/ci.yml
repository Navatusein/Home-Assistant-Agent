name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HomeAssistant.Agent.sln -c Release

      - name: Test
        run: dotnet test tests/HomeAssistant.Agent.Tests/HomeAssistant.Agent.Tests.csproj -c Release --no-build
